<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>pending</title>
<link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
<main id="host"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
  import { eaMarketplace } from './js/pages/marketplace.js';
  import { permissionsFor } from './js/data.js';

  const results = [];
  const ok = (name, pass, extra = '') => results.push(`${pass ? 'PASS' : 'FAIL'} ${name}${extra ? ' ' + extra : ''}`);

  const host = document.getElementById('host');
  const perms = permissionsFor('pro');
  const page = await eaMarketplace({ permissions: perms });
  host.append(page);

  const cards = () => host.querySelectorAll('article.plan').length;
  ok('six cards render', cards() === 6, `got ${cards()}`);

  const tabs = [...host.querySelectorAll('.tabs button')];
  tabs.find((b) => b.textContent === 'Gold').click();
  ok('Gold filter narrows to 2', cards() === 2, `got ${cards()}`);
  tabs.find((b) => b.textContent === 'All').click();
  ok('All restores 6', cards() === 6, `got ${cards()}`);

  const input = host.querySelector('input[type="search"]');
  input.value = 'nas100';
  input.dispatchEvent(new Event('input', { bubbles: true }));
  ok('search filters to 1', cards() === 1, `got ${cards()}`);
  input.value = '';
  input.dispatchEvent(new Event('input', { bubbles: true }));

  const rows = () => host.querySelectorAll('table.table tbody tr').length;
  const before = rows();
  const installBtn = [...host.querySelectorAll('article.plan button')].find((b) => b.textContent === 'Install');
  ok('an Install button exists for pro', Boolean(installBtn));
  installBtn?.click();
  ok('install adds a download row', rows() === before + 1, `${before} -> ${rows()}`);
  ok('installed button becomes Installed', [...host.querySelectorAll('article.plan button')].some((b) => b.textContent === 'Installed'));

  const gated = [...host.querySelectorAll('article.plan button')].some((b) => b.textContent.startsWith('Upgrade to'));
  ok('locked EAs show Upgrade labels', gated, 'pro plan renders at least one upgrade path');

  tabs.find((b) => b.textContent === 'Included').click();
  ok('Included filter shows plan-allowed EAs', cards() >= 1, `got ${cards()}`);

  document.title = results.join(' | ');
  const pre = document.createElement('pre');
  pre.id = 'results';
  pre.textContent = results.join('\n');
  document.body.append(pre);
</script>
</body>
</html>
