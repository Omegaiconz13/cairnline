<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>pending</title>
<style>body{margin:0;font:12px monospace;background:#050505;color:#eee}iframe{width:390px;height:1400px;border:0}</style>
</head>
<body>
<iframe id="f" src="./index.html#/synthetic-chart"></iframe>
<pre id="results">pending</pre>
<script type="module">
  const f = document.getElementById('f');
  const out = document.getElementById('results');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const lines = [];
  f.addEventListener('load', async () => {
    await wait(1500);
    const d = f.contentDocument;
    const scrollW = d.documentElement.scrollWidth;
    const clientW = d.documentElement.clientWidth;
    lines.push(`scrollWidth=${scrollW} clientWidth=${clientW}`);
    const wide = [...d.querySelectorAll('#view *')].filter((n) => n.getBoundingClientRect().width > clientW + 1);
    const deepest = wide.filter((n) => !wide.some((o) => o !== n && n.contains(o)));
    lines.push('wide=' + wide.length + ' deepest=' + deepest.length);
    for (const n of deepest.slice(0, 10)) {
      const b = n.getBoundingClientRect();
      const cs = f.contentWindow.getComputedStyle(n);
      lines.push(`${b.width.toFixed(0)}w ${n.tagName.toLowerCase()}.${(n.className || '').toString().split(' ').slice(0,2).join('.')} display=${cs.display} minw=${cs.minWidth} ws=${cs.whiteSpace} text="${(n.textContent || '').trim().slice(0, 40)}"`);
    }
    out.textContent = lines.join('\n');
    document.title = 'done';
  });
</script>
</body>
</html>
