<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>pending</title>
<link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
<main id="host" style="padding:0"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
  import { syntheticChart } from './js/pages/synthetic.js';

  const results = [];
  const ok = (name, pass, extra = '') => results.push(`${pass ? 'PASS' : 'FAIL'} ${name}${extra ? ' — ' + extra : ''}`);
  const host = document.getElementById('host');
  host.append(await syntheticChart({ permissions: {} }));
  await new Promise((r) => setTimeout(r, 250));

  const svg = host.querySelector('svg[role="img"]');
  ok('chart renders', Boolean(svg), svg ? svg.getAttribute('aria-label') : 'no svg');

  const priceLabels = [...host.querySelectorAll('svg text')].map((t) => t.textContent.trim());
  const numeric = priceLabels.filter((t) => /^[\d.]+$/.test(t));
  ok('five price labels drawn', numeric.length >= 5, numeric.join(', '));
  const timeLabels = priceLabels.filter((t) => /^\d{2}:\d{2}$/.test(t));
  ok('time axis labels drawn', timeLabels.length === 5, timeLabels.join(', '));

  const cardTitle = [...host.querySelectorAll('.card__title')].map((n) => n.textContent);
  ok('instrument + sizing card present', cardTitle.includes('Instrument') && host.textContent.includes('Practice position size'), cardTitle.join(' | '));

  // Interaction: switching index redraws for the new instrument.
  const tabs = [...host.querySelectorAll('.tabs button')];
  const v75 = tabs.find((b) => b.textContent === 'V75');
  v75.click();
  await new Promise((r) => setTimeout(r, 60));
  const label2 = host.querySelector('svg[role="img"]').getAttribute('aria-label');
  ok('index switch redraws chart', label2.includes('Volatility 75'), label2);
  ok('spec follows the switch', host.textContent.includes('Volatility 75 (V75)'));

  // Sizing maths: 10000 * 1% = $100 risk; 250 pts * tick 0.01 = 2.5 per lot -> 40 lots.
  const notes = [...host.querySelectorAll('.form__note')].map((n) => n.textContent);
  ok('position size maths', notes.some((t) => t.includes('40.00 lots on V75')), notes.find((t) => t.includes('lots on')) || 'none');

  const tfButtons = [...host.querySelectorAll('.tabs button')].filter((b) => /^M\d|H\d/.test(b.textContent));
  tfButtons.find((b) => b.textContent === 'H4').click();
  await new Promise((r) => setTimeout(r, 60));
  ok('timeframe switch redraws', host.querySelector('svg[role="img"]').getAttribute('aria-label').includes('H4'));

  // Geometry: no dead space between the chart card and the comparison card.
  const cards = [...host.querySelectorAll('.card')];
  const chartCard = cards.find((c) => c.textContent.includes('Simulated'));
  const compare = cards.find((c) => c.textContent.startsWith('Index comparison'));
  const svgBox = host.querySelector('svg[role="img"]').getBoundingClientRect();
  const leftCardBox = chartCard.getBoundingClientRect();
  const trailing = leftCardBox.bottom - svgBox.bottom;
  ok('chart card has no dead space below the chart', trailing < 200, `${trailing.toFixed(0)}px below svg`);
  const txt = host.textContent;
  ok('simulation is stated honestly', txt.includes('Simulated series') && txt.includes('not a broker feed') && txt.includes('No — simulation only'));

  const geo = (sel, node) => {
    const b = node.getBoundingClientRect();
    results.push(`GEO ${sel}: top=${b.top.toFixed(0)} bottom=${b.bottom.toFixed(0)} h=${b.height.toFixed(0)}`);
  };
  geo('page', host.firstElementChild);
  geo('chartCard', chartCard);
  const specCard = cards.find((c) => c.textContent.includes('Annualised volatility'));
  geo('instrumentCard', specCard);
  geo('sidebarColumn', specCard.parentElement);
  geo('compareCard', compare);

  const pre = document.createElement('pre');
  pre.id = 'results';
  pre.textContent = results.join('\n');
  document.body.append(pre);
  document.title = results.filter((r) => r.startsWith('FAIL')).length ? 'FAILURES' : 'ALL PASS';
</script>
</body>
</html>
